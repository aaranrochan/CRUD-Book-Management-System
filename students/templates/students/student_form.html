<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }

        form {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: green;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form method="POST">
        {% csrf_token %}

        <h2>
            {% if student %}
                Edit Student
            {% else %}
                Add Student
            {% endif %}
        </h2>

        <label>Name:</label>
        <input type="text" name="name"
               value="{{ student.name|default:'' }}" required>

        <label>Email:</label>
        <input type="email" name="email"
               value="{{ student.email|default:'' }}" required>

        <label>Department:</label>
        <input type="text" name="department"
               value="{{ student.department|default:'' }}" required>

        <button type="submit">Save Student</button>

        <a href="{% url 'student_list' %}">Cancel</a>
    </form>

</body>
</html>
