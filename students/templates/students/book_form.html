<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }

        .form-container {
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>
            {% if book %}
                ✏️ Edit Book
            {% else %}
                📚 Add New Book
            {% endif %}
        </h1>

        <form method="POST">
            {% csrf_token %}

            <label for="title">Book Title</label>
            <input type="text" id="title" name="title"
                   value="{{ book.title|default:'' }}"
                   placeholder="Enter book title" required>

            <label for="author">Author Name</label>
            <input type="text" id="author" name="author"
                   value="{{ book.author|default:'' }}"
                   placeholder="Enter author name" required>

            <label for="price">Price (₹)</label>
            <input type="number" id="price" name="price"
                   value="{{ book.price|default:'' }}"
                   placeholder="Enter book price" min="0" required>

            <button type="submit">Save Book</button>
        </form>

        <a href="{% url 'book_list' %}" class="back-link">
            ← Back to Book List
        </a>

    </div>

</body>
</html>
