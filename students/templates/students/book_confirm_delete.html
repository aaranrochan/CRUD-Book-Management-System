<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }

        .delete-container {
            max-width: 450px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #dc2626;
        }

        p {
            line-height: 1.7;
            color: #475569;
        }

        .delete-btn {
            padding: 12px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            display: inline-block;
            padding: 12px 20px;
            background: #e2e8f0;
            color: #1e293b;
            border-radius: 7px;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <div class="delete-container">

        <h1>Delete Book?</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ book.title }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="delete-btn">
                Yes, Delete
            </button>

            <a href="{% url 'book_list' %}" class="cancel-btn">
                Cancel
            </a>
        </form>

    </div>

</body>
</html>
